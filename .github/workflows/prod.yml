name: Production Build & Deploy

# Trigger workflow on push to main branch or production tags
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Cache npm dependencies and Next.js build cache
      # This significantly speeds up builds by caching node_modules and .next/cache
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            .next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-
            ${{ runner.os }}-nextjs-

      # Step 4: Install dependencies with clean install
      # npm ci is faster and more reliable than npm install for CI/CD
      - name: Install dependencies
        run: npm ci

      # Step 5: Run linting to ensure code quality
      - name: Run linter
        run: npm run lint

      # Step 6: Build the Next.js application for production
      - name: Build application
        run: npm run build

      # Step 7: Run tests (if you have tests configured)
      # - name: Run tests
      #   run: npm test
      #   continue-on-error: false

      # Step 8: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 9: Deploy to AWS S3 Production bucket
      - name: Deploy to AWS S3 Production
        run: |
          aws s3 sync out/ s3://${{ secrets.PROD_S3_BUCKET }} --delete --cache-control max-age=31536000,public

      # Step 10: Invalidate CloudFront cache for Production
      - name: Invalidate CloudFront Production Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_CLOUDFRONT_ID }} \
            --paths "/*"

      # Step 11: Create GitHub Release (for tagged commits)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      # Step 12: Output build success
      - name: Build completed
        run: |
          echo "Production build completed successfully!"
          echo "Deployed to S3 bucket: ${{ secrets.PROD_S3_BUCKET }}"

      # Step 13: Notify on success (optional - Slack notification)
      # - name: Notify Slack
      #   if: success()
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     text: 'Production deployment successful!'
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
